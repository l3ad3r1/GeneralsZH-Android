// GeneralsX @build android-port 30/07/2026
// Isolated native-Mali gate. This package coexists with the playable app and
// packages prebuilt SDL3, DXVK Native 1.9.2b, and the D3D8/D3D9 clear gates.

plugins {
    id 'com.android.application'
}

android {
    namespace 'me.generalsx.malispike'
    compileSdk 35

    defaultConfig {
        applicationId 'me.generalsx.malispike'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            packagingOptions {
                jniDebuggable true
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            java.srcDirs = ['src/main/java']

            def cxxDir = file('../app/.cxx')
            if (cxxDir.exists()) {
                cxxDir.eachFileRecurse { f ->
                    if (f.name == 'SDLActivity.java' && f.path.contains('sdl3-src')) {
                        java.srcDirs += f.parentFile.parentFile.parentFile.parentFile
                    }
                }
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
            keepDebugSymbols += [
                '**/libdxvk_d3d8.so',
                '**/libdxvk_d3d9.so',
                '**/libmain.so'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
